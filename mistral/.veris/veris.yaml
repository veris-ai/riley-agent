# Veris simulation configuration
version: "1.0"

riley-mistral-env:
  services:
    - name: postgres
      config:
        SCHEMA_PATH: /agent/db/init.sql

  actor:
    channels:
      - type: voice_ws
        url: ws://localhost:8008/voice

  agent:
    name: Riley (Mistral)
    code_path: /agent
    # One process: a FastAPI app serving the voice_ws endpoint on :8008. Each
    # /voice connection runs its own pipeline — a Voxtral Realtime transcription
    # session, Mistral chat completions for the five card-ops tools, and Voxtral
    # TTS for the reply — with turn-taking and barge-in handled in-process.
    entry_point: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8008
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veris
      # All three legs bill to one key. Inject once:
      #   veris env vars set MISTRAL_API_KEY=... --secret
      # Optional overrides: MISTRAL_STT_MODEL, MISTRAL_TTS_MODEL, MISTRAL_VOICE
      # (default en_paul_neutral).
      #
      # Set explicitly so the model is baked into the image tag: `latest` is the
      # flagship, and the `mistral-small` tag is built from this same code with
      # this line changed, which is what makes the two comparable as a pair.
      MISTRAL_LLM_MODEL: mistral-large-latest

# Second configuration: identical code and prompt, one tier down on the LLM.
# The cascade rows it sits beside all hold the LLM at gpt-4.1-mini, a fast small
# model, so the flagship-tier row above is not a like-for-like comparison on its
# own — this pair isolates model tier from architecture, the same way the gemini
# and openai-realtime rows do.
riley-mistral-small-env:
  services:
    - name: postgres
      config:
        SCHEMA_PATH: /agent/db/init.sql

  actor:
    channels:
      - type: voice_ws
        url: ws://localhost:8008/voice

  agent:
    name: Riley (Mistral Small)
    code_path: /agent
    # One process: a FastAPI app serving the voice_ws endpoint on :8008. Each
    # /voice connection runs its own pipeline — a Voxtral Realtime transcription
    # session, Mistral chat completions for the five card-ops tools, and Voxtral
    # TTS for the reply — with turn-taking and barge-in handled in-process.
    entry_point: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8008
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veris
      # All three legs bill to one key. Inject once:
      #   veris env vars set MISTRAL_API_KEY=... --secret
      # Optional overrides: MISTRAL_STT_MODEL, MISTRAL_TTS_MODEL, MISTRAL_VOICE
      # (default en_paul_neutral).
      #
      # Set explicitly so the model is baked into the image tag: `latest` is the
      # flagship, and the `mistral-small` tag is built from this same code with
      # this line changed, which is what makes the two comparable as a pair.
      MISTRAL_LLM_MODEL: mistral-small-latest
