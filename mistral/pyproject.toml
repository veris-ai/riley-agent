[project]
name = "riley-mistral"
version = "0.1.0"
description = "Riley card-support voice agent on Mistral's speech-to-speech pipeline — Voxtral Realtime STT, a Mistral chat completion with BCS card-ops tools backed by Postgres, and Voxtral TTS, assembled into a turn-taking loop and served on a voice_ws channel."
readme = "README.md"
# Pinned to 3.12, and not by accident. Python 3.13 turned on
# `ssl.VERIFY_X509_STRICT` by default, and the Veris sandbox intercepts all
# outbound traffic with a MITM proxy whose CA carries no keyUsage extension —
# which strict mode rejects, failing every HTTPS call with "CA cert does not
# include key usage extension". On 3.12 the same connection verifies fine.
# Raising this ceiling means the agent cannot talk to Mistral inside a sandbox.
# 3.12 also still has `audioop` in the stdlib, so no shim dependency is needed.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "mistralai[realtime]>=2.9",
    "numpy>=2.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0",
]
