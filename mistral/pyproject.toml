[project]
name = "riley-mistral"
version = "0.1.0"
description = "Riley card-support voice agent on Mistral's speech-to-speech pipeline — Voxtral Realtime STT, a Mistral chat completion with BCS card-ops tools backed by Postgres, and Voxtral TTS, assembled into a turn-taking loop and served on a voice_ws channel."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "mistralai[realtime]>=2.9",
    "numpy>=2.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0",
    # `audioop` left the stdlib in 3.13; this is the same module, unvendored.
    # Used for the 24 kHz → 16 kHz downsample on the way into Voxtral Realtime.
    "audioop-lts>=0.2.2",
]
