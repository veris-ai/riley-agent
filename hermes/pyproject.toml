[project]
name = "riley-hermes"
version = "0.1.0"
description = "Riley card-support voice agent on Nous Research's Hermes Agent — the hermes-agent gateway running a veris-voice platform plugin (Deepgram nova-3 STT, ElevenLabs streaming TTS, hermes-4 via the Nous Portal API), with BCS card-ops tools backed by Postgres, served on a voice_ws channel."
readme = "README.md"
# Pinned to 3.12, and not by accident. Python 3.13 turned on
# `ssl.VERIFY_X509_STRICT` by default, and the Veris sandbox intercepts all
# outbound traffic with a MITM proxy whose CA carries no keyUsage extension —
# which strict mode rejects, failing every HTTPS call with "CA cert does not
# include key usage extension". On 3.12 the same connection verifies fine.
# 3.12 also still has `audioop` in the stdlib, which the adapter's VAD uses.
requires-python = ">=3.12,<3.13"
# hermes-agent itself is NOT declared here: its build backend refuses
# non-editable installs (upstream supports only their shell installer, Docker,
# Nix, or an editable dev install), so it can't be a locked wheel dependency.
# It is installed editable from a source checkout pinned to commit
# 863e31318553cda8ad61df681d08175364d4164b — see .veris/Dockerfile.sandbox for
# the sandbox and README.md "Run locally" for a dev machine. hermes-agent
# exact-pins its own dependency tree, so the commit pin carries the resolution.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0",
    # Hermes lazy-installs this on first use (tools/lazy_deps.py); the sandbox
    # image bakes it in at the exact version hermes would pick itself.
    "elevenlabs==1.59.0",
]
