[project]
name = "riley-grok-voice"
version = "0.1.0"
description = "Riley card-support voice agent on the raw xAI Grok speech-to-speech API — a single grok-voice-think-fast-2.0 WebSocket session per call, with BCS card-ops tools backed by Postgres, bridged to a voice_ws channel."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
]
