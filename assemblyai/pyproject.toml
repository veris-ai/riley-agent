[project]
name = "riley-assemblyai"
version = "0.1.0"
description = "Riley card-support voice agent on AssemblyAI's Voice Agent API — speech-to-speech over one WebSocket with a BYO gpt-4.1-mini LLM on a stored agent, BCS card-ops tools backed by Postgres, bridged to a voice_ws channel."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0",
]
