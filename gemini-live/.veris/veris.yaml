# Veris simulation configuration
version: "1.0"

riley-gemini-live-env:
  services:
    - name: postgres
      config:
        SCHEMA_PATH: /agent/db/init.sql

  actor:
    channels:
      - type: voice_ws
        url: ws://localhost:8008/voice

  agent:
    name: Riley (Gemini Live)
    code_path: /agent
    entry_point: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8008
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veris
      # The agent opens a Gemini Live WebSocket session per /voice connection.
      # Inject once: veris env vars set GEMINI_API_KEY=... --secret
      GEMINI_API_KEY: ${GEMINI_API_KEY}
