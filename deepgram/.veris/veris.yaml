# Veris simulation configuration
version: "1.0"

riley-deepgram-env:
  services:
    - name: postgres
      config:
        SCHEMA_PATH: /agent/db/init.sql

  actor:
    channels:
      - type: voice_ws
        url: ws://localhost:8008/voice

  agent:
    name: Riley (Deepgram)
    code_path: /agent
    # One process: a FastAPI app serving the voice_ws endpoint on :8008. Each
    # /voice connection opens its own Deepgram Voice Agent session and bridges
    # PCM16 audio + function calls.
    entry_point: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8008
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veris
      # Deepgram Voice Agent — one key, covering STT, TTS and the managed
      # OpenAI LLM. Inject once:
      #   veris env vars set DEEPGRAM_API_KEY=... --secret
      # Optional overrides: DEEPGRAM_LISTEN_MODEL (default nova-3),
      # DEEPGRAM_VOICE (default aura-2-thalia-en), LLM_MODEL (default gpt-4.1-mini).
