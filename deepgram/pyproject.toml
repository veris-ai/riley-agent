[project]
name = "riley-deepgram"
version = "0.1.0"
description = "Riley card-support voice agent on Deepgram's Voice Agent API — a single agent WebSocket session per call carrying Deepgram STT/TTS and a managed OpenAI LLM, with BCS card-ops tools backed by Postgres, bridged to a voice_ws channel."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
]
